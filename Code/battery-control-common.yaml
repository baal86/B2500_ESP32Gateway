esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - switch.turn_on: power_led

esp32:
  board: adafruit_feather_esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

api:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: ${topic_prefix}
  birth_message:
    topic: ${topic_prefix}/status
    payload: online
  will_message:
    topic: ${topic_prefix}/status
    payload: offline
  discovery: false

logger:
  level: INFO

ota:
  - platform: esphome

external_components:
  - source:
      type: git
      url: https://github.com/tomquist/esphome-b2500
      ref: "main"
    refresh: 0s
    components: [b2500]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - switch.turn_on: wifi_led
  on_disconnect:
    then:
      - switch.turn_off: wifi_led
#  fast_connect: True
  manual_ip:
    static_ip: ${ip_address}
    gateway: ${ip_gateway}
    subnet: ${ip_netmask}

b2500:
  - id: b2500_1
    generation: 2
    update_interval: 10s
    ble_client_id: b2500_ble_client

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Berlin"

ble_client:
  - mac_address: ${ble_device_mac}
    id: b2500_ble_client
    on_connect:
      then:
        - logger.log:
            level: INFO
            format: "Connected to BLE device (B2500)"
        - delay: 1s
        - b2500.set_datetime:
            id: b2500_1
            datetime: !lambda 'return id(sntp_time).now();'
        - switch.turn_on: ble_led
    on_disconnect:
      then:
        - logger.log:
            level: INFO
            format: "Disconnected from BLE device (B2500)"
        - switch.turn_off: ble_led

button:
  - platform: restart
    id: controller_restart
    name: "Restart Controller"

  - platform: b2500
    b2500_id: b2500_1
    generation: 2
    reboot:
      id: b2500_button_reboot_1
      name: "Reboot B2500"

datetime:
  - platform: b2500
    b2500_id: b2500_1
    generation: 2
    timer1_start:
      id: b2500_timer1_time_start_1
      name: "Timer 1 Start Time"
    timer1_end:
      id: b2500_timer1_time_end_1
      name: "Timer 1 End Time"
    timer2_start:
      id: b2500_timer2_time_start_1
      name: "Timer 2 Start Time"
    timer2_end:
      id: b2500_timer2_time_end_1
      name: "Timer 2 End Time"

number:
  - platform: b2500
    b2500_id: b2500_1
    generation: 2
    dod:
      id: b2500_battery_dod_1
      name: "Depth of Discharge"
    timer1_output_power:
      id: b2500_timer1_power_1
      name: "Timer 1 Output Power"
    timer2_output_power:
      id: b2500_timer2_power_1
      name: "Timer 2 Output Power"

switch:
  - platform: template
    name: "Auto Control"
    id: auto_control
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_off:
      - switch.turn_off: meter_led
      - number.set:
          id: b2500_timer1_power_1
          value: 140
    on_turn_on:
      - switch.turn_on: meter_led

  - platform: ble_client
    ble_client_id: b2500_ble_client
    name: "Bluetooth Enabled"
    id: b2500_bluetooth_enabled_1
    icon: mdi:bluetooth-connect

  - platform: b2500
    b2500_id: b2500_1
    generation: 2
    timer1_enabled:
      id: b2500_timer1_enabled_1
      name: "Timer 1 Enabled"
    timer2_enabled:
      id: b2500_timer2_enabled_1
      name: "Timer 2 Enabled"

  - platform: gpio
    pin:
      number: 4
      mode: output
    id: power_led
    internal: true
  - platform: gpio
    pin:
      number: 5
      mode: output
    id: wifi_led
    internal: true
  - platform: gpio
    pin:
      number: 6
      mode: output
    id: ble_led
    internal: true
  - platform: gpio
    pin:
      number: 7
      mode: output
    id: meter_led
    internal: true

select:
  - platform: b2500
    b2500_id: b2500_1
    generation: 2
    charge_mode:
      id: b2500_charge_mode_1
      name: "Charge Mode"

text_sensor:

  - platform: b2500
    b2500_id: b2500_1
    generation: 2

    device_type:
      name: "Device Type"
      id: b2500_device_type_1
      icon: mdi:devices

    device_id:
      name: "Device ID"
      id: b2500_device_id_1
      icon: mdi:identifier

    device_time:
      name: "Device Time"
      id: b2500_device_time_1
      icon: mdi:clock

    firmware_version:
      name: "Device Firmware Version"
      id: b2500_device_fw_version_1
      icon: mdi:chip

    mac_address:
      name: "MAC Address"
      id: b2500_device_ble_mac_1
      icon: mdi:network

    wifi_ssid:
      name: "Wifi SSID"
      id: b2500_device_wifi_ssid_1
      icon: mdi:wifi

    fc41d_version:
      name: "FC41D-Firmware"
      id: b2500_device_fc41d_fw_1
      icon: mdi:chip

binary_sensor:
  - platform: b2500
    b2500_id: b2500_1
    generation: 2

    wifi_connected:
      name: "Wifi Connected"
      id: b2500_device_wifi_ok_1
      icon: mdi:wifi

    mqtt_connected:
      name: "MQTT Connected"
      id: b2500_device_mqtt_ok_1
      icon: mdi:cloud

    extern1_connected:
      name: "Extension 1 connected"
      id: b2500_extern1_connected_1
      icon: mdi:battery-plus

    extern2_connected:
      name: "Extension 2 connected"
      id: b2500_extern2_connected_1
      icon: mdi:battery-plus

sensor:
  - platform: wifi_signal
    name: "ESP WiFi Signal"
    update_interval: 10s

  - platform: internal_temperature
    name: "ESP Temperature"

  - platform: uptime
    name: "ESP Uptime"
    filters:
      - lambda: return x / 3600.0;
    unit_of_measurement: "hours"
    accuracy_decimals: 2

  - platform: mqtt_subscribe
    name: "Setpoint"
    id: setpoint
    expire_after: 30s
    topic: esphome/basement/smartmeter/power/setpoint
    on_value:
      if:
        condition:
          switch.is_on: auto_control
        then:
        - number.set:
            id: b2500_timer1_power_1
            value: !lambda "return x;"

  - platform: b2500
    b2500_id: b2500_1
    generation: 2

    in1_power:
      name: "In 1 - Power"
      id: b2500_in1_power_1
      device_class: power
      icon: mdi:solar-power

    in2_power:
      name: "In 2 - Power"
      id: b2500_in2_power_1
      device_class: power
      icon: mdi:solar-power

    in_total_power:
      name: "Total Power In"
      id: b2500_total_power_in_1
      device_class: power

    out1_power:
      name: "Out 1 - Power"
      id: b2500_out1_power_1
      device_class: power

    out2_power:
      name: "Out 2 - Power"
      id: b2500_out2_power_1
      device_class: power

    out_total_power:
      name: "Total Power Out"
      id: b2500_total_power_out_1
      device_class: power

    soc:
      name: "Battery Level"
      id: b2500_battery_remaining_percent_1

    capacity:
      name: "Battery Capacity"
      id: b2500_battery_remaining_capacity_1
      device_class: energy

    temperature_low:
      name: "Temperature 1"
      id: b2500_device_temperature1_1
      device_class: temperature
      icon: mdi:thermometer

    temperature_high:
      name: "Temperature 2"
      id: b2500_device_temperature2_1
      device_class: temperature
      icon: mdi:thermometer

    daily_total_battery_charge:
      name: "Charge"
      id: b2500_daily_total_battery_charge_1
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: Wh
      accuracy_decimals: 0

    daily_total_battery_discharge:
      name: "Discharge"
      id: b2500_daily_total_battery_discharge_1
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: Wh
      accuracy_decimals: 0

  - platform: total_daily_energy
    name: "Solar"
    id: b2500_total_daily_energy_in_1
    power_id: b2500_total_power_in_1
    unit_of_measurement: kWh
    method: left
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
